name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt, clippy, doc, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - name: cargo deny
        run: cargo deny check

  linux:
    name: Linux (Debian trixie)
    runs-on: ubuntu-latest
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          name=dayzmake-${GITHUB_REF_NAME//\//-}-debian-trixie-x86_64
          mkdir "$name"
          cp target/release/dayzmake LICENSE README.md "$name/"
          strip "$name/dayzmake"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    env:
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install static OpenSSL
        run: |
          vcpkg install openssl:x64-windows-static-md
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          $name = "dayzmake-$($env:GITHUB_REF_NAME -replace '/', '-')-windows-x86_64"
          New-Item -ItemType Directory $name
          Copy-Item target\release\dayzmake.exe, LICENSE, README.md $name
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"
