name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      skip-coverage:
        description: Skip the Codecov upload, e.g. when the calling workflow's own CI
          run uploads coverage for the same commit already.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt, clippy, doc, deny, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Install cargo-deny and cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny,cargo-llvm-cov
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - name: cargo deny
        run: cargo deny check
      - name: Coverage floor
        run: cargo llvm-cov --all-features --fail-under-lines 70

  coverage:
    name: Coverage (Codecov)
    # a second upload for a commit SHA whose coverage was already uploaded is
    # rejected by Codecov; the release workflow passes skip-coverage: true
    # because its tag commit is also pushed to main, whose CI uploads it
    if: ${{ !inputs.skip-coverage }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: make cover
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  linux:
    name: Linux (Debian trixie)
    runs-on: ubuntu-latest
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Test
        run: cargo test --locked --no-fail-fast
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          name=dayzmake-${GITHUB_REF_NAME//\//-}-debian-trixie-x86_64
          mkdir "$name"
          cp target/release/dayzmake LICENSE README.md "$name/"
          strip "$name/dayzmake"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: "*.tar.gz"

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    env:
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install static OpenSSL
        run: |
          vcpkg install openssl:x64-windows-static-md
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" >> $env:GITHUB_ENV
      - name: Test
        run: cargo test --locked --no-fail-fast
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          $name = "dayzmake-$($env:GITHUB_REF_NAME -replace '/', '-')-windows-x86_64"
          New-Item -ItemType Directory $name
          Copy-Item target\release\dayzmake.exe, LICENSE, README.md $name
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: "*.zip"
