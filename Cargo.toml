[workspace]
members = ["crates/dayzmake-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-or-later"
repository = "https://github.com/bzed/dayzmake"
authors = ["KoffeinFlummi <koffeinflummi@protonmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
float_cmp = "deny"

[package]
name = "dayzmake"
version = "3.1.0"
description = "DayZ modding tools"
license.workspace = true
keywords = ["dayz", "pbo", "paa", "modding", "bohemia"]
categories = ["command-line-utilities", "game-development"]
include = ["src/**/*", "/README.md", "/LICENSE", "/Cargo.toml"]
authors.workspace = true
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "dayzmake"

[dependencies]
colored = "2.1"
docopt = "1.1"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
serde_json = "1"
image = "0.24"
dayzmake-core = { path = "crates/dayzmake-core", version = "0.3.0" }
sha1 = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
winreg = "0.52"

[dev-dependencies]
tempfile = "3.10"
insta = { version = "1.49.0", features = ["json"] }
lzo1x = "0.2.2"

[lints]
workspace = true

[profile.release]
overflow-checks = true

# The navmesh tile builder is slow without optimisation; its synthetic-world tests need this to stay
# under 20 s in debug builds.
[profile.dev.package.dayzmake-core]
opt-level = 2
