[package]
name = "dayzmake-core"
version = "0.1.0"
description = "Readers and writers for DayZ file formats: PBO, rapified config, P3D, PAA, BI keys and signatures"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["dayz", "pbo", "paa", "modding", "bohemia"]
categories = ["parser-implementations", "game-development"]
include = ["src/**/*", "/README.md", "/LICENSE", "/Cargo.toml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sign", "image"]
# BI signatures and keys (`sign` module); needs OpenSSL for RSA.
sign = ["dep:openssl"]
# PAA <-> image conversion (`Paa::from_dynamic_image`, `Paa::to_dynamic_image`, `pub use image`).
image = ["dep:image"]

[dependencies]
byteorder = "1.5"
openssl = { version = "0.10", optional = true }
linked-hash-map = "0.5.6"
regex = "1.10"
peg = "0.8"
image = { version = "0.24", optional = true }
texpresso = "2.0"
lzo1x = "0.2.2"
encoding_rs = "0.8"
sha1 = { version = "0.11.0", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5.1"

[[bench]]
name = "preprocess"
harness = false

[[bench]]
name = "config"
harness = false

[lints]
workspace = true
