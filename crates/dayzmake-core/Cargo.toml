[package]
name = "dayzmake-core"
version = "0.2.0"
description = "Readers and writers for DayZ file formats: PBO, rapified config, P3D, PAA, BI keys and signatures"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["dayz", "pbo", "paa", "modding", "bohemia"]
categories = ["parser-implementations", "game-development"]
include = ["src/**/*", "/README.md", "/LICENSE", "/Cargo.toml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sign", "image"]
# BI signatures and keys (`sign` module): keys, signing, verification and key generation use `rsa` (pure Rust).
sign = ["dep:rsa", "dep:getrandom", "dep:zeroize"]
# PAA <-> image conversion (`Paa::from_dynamic_image`, `Paa::to_dynamic_image`, `pub use image`).
image = ["dep:image"]

[dependencies]
byteorder = "1.5"
rsa = { version = "0.10.0", optional = true, default-features = false, features = ["std", "getrandom", "hazmat"] }
linked-hash-map = "0.5.6"
regex = "1.10"
peg = "0.8"
image = { version = "0.24", optional = true }
texpresso = "2.0"
lzo1x = "0.2.2"
encoding_rs = "0.8"
sha1 = { version = "0.11.0", default-features = false }
same-file = "1.0.6"
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"], optional = true }
zeroize = { version = "1.9.1", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5.1"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
num-bigint = { version = "0.5.1", default-features = false }

[[bench]]
name = "preprocess"
harness = false

[[bench]]
name = "config"
harness = false

[lints]
workspace = true
