[graph]
all-features = true

[advisories]
yanked = "warn"

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "CC0-1.0", "Unlicense",
    # dayzmake is GPL-2.0-or-later, so GPL/LGPL code is compatible.
    "GPL-2.0-or-later", "GPL-2.0", "GPL-3.0-or-later", "LGPL-2.1-or-later", "LGPL-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
